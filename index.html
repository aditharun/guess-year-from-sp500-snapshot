<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3eee4">
  <meta name="description" content="Guess the year of a real S&amp;P 500 session from the companies and their share prices.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; object-src 'none'">
  <title>The Tape</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="sheet">
    <header>
      <p class="kicker">S&amp;P 500</p>
      <h1>The Tape</h1>
      <p class="lede" id="lede">A real session from 1996 on.</p>
      <div class="sort" role="group" aria-label="Sort the tape">
        <button type="button" data-sort="cap" aria-pressed="true">Cap</button>
        <button type="button" data-sort="name" aria-pressed="false">Name</button>
        <button type="button" data-sort="price" aria-pressed="false">Price</button>
      </div>
    </header>
    <main id="board">
      <p id="status" class="status" role="status">Pulling a session…</p>
      <ol id="tape"></ol>
    </main>
    <form id="guess" class="dock" autocomplete="off">
      <div id="pickers">
        <label class="year-hint" id="year-hint" for="year">Pick a year from 1996 through 2026.</label>
        <div class="year-field">
          <input id="year" name="tape-year" type="text" inputmode="numeric" maxlength="4" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="Type a year" aria-autocomplete="list" aria-controls="year-list" aria-expanded="false" role="combobox">
          <div id="year-list" class="year-list" role="listbox" hidden></div>
        </div>
        <p class="year-note" id="year-note" hidden>Stay between 1996 and 2026.</p>
        <button type="submit" id="lock" disabled>Lock in this year</button>
      </div>
      <div id="result" class="result" hidden>
        <p class="when" id="result-when"></p>
        <p class="session" id="result-day"></p>
        <p class="distance" id="result-distance"></p>
        <p class="aside" id="result-aside"></p>
        <p class="yours" id="result-yours"></p>
        <button type="button" id="again">Another session</button>
      </div>
    </form>
  </div>
  <noscript>
    <p class="noscript">The Tape needs JavaScript to deal a session. It stays on this page and does not load remote code.</p>
  </noscript>
  <script src="js/app.js"></script>
</body>
</html>
